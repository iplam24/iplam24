# DevDock Workstation — Auto-generated GitHub Actions CI/CD
# Tech Stack: NodeJs | Deploy Target: SSH_RSYNC
name: CI/CD Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci --prefer-offline || npm install
          npm run build --if-present

      - name: Execute Server Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=== [DevDock CI/CD] Starting Deployment: $(date) ==="
            mkdir -p /var/www/my-app
            cd /var/www/my-app

            # 1. Pull latest code
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            fi

            # 2. Custom Post-deploy commands
            npm install --production
            pm2 reload all || pm2 restart all || npm run start &

            # 3. Post-deployment Health Check
            sleep 4
            echo "Checking service health on port 3000..."
            if command -v curl >/dev/null 2>&1; then
              curl -f --retry 3 --retry-delay 2 http://127.0.0.1:3000/ || echo "Warning: Healthcheck did not return 200 OK"
            fi

            echo "=== [DevDock CI/CD] Deployment Successfully Finished! ==="
